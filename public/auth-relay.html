<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 1.5rem; padding: 2rem; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
    .logo { width: 4rem; height: 4rem; margin: 0 auto 1.25rem; background: linear-gradient(135deg, #1e40af, #2563eb); border-radius: 1rem; display: flex; align-items: center; justify-content: center; font-size: 2rem; box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3); }
    h1 { font-size: 1.35rem; font-weight: 800; margin-bottom: 0.5rem; }
    p { font-size: 0.875rem; color: #94a3b8; line-height: 1.5; margin-bottom: 1.5rem; }
    .status { padding: 0.75rem 1rem; border-radius: 0.75rem; background: #0f172a; border: 1px solid #334155; font-size: 0.8rem; font-family: monospace; color: #38bdf8; margin-bottom: 1.5rem; word-break: break-all; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.75rem; width: 100%; padding: 0.875rem 1.25rem; border-radius: 0.875rem; font-size: 0.95rem; font-weight: 700; cursor: pointer; border: none; transition: all 0.2s; background: #2563eb; color: #fff; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3); }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .spinner { width: 1.25rem; height: 1.25rem; border: 2px solid rgba(255, 255, 255, 0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .info { font-size: 0.75rem; color: #64748b; margin-top: 1.25rem; }
  </style>
  <!-- Load Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCmRTRcbnGnCto0OWEZFXg1OEIgXywBtYo",
      authDomain: "gen-lang-client-0255150793.firebaseapp.com",
      projectId: "gen-lang-client-0255150793",
      storageBucket: "gen-lang-client-0255150793.firebasestorage.app",
      messagingSenderId: "170188921418",
      appId: "1:170188921418:web:1c67b1d7d44e7460fca4b3",
      measurementId: "G-553546Q2L2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.addScope('profile');
    provider.addScope('email');
    provider.setCustomParameters({ prompt: 'select_account' });

    const statusEl = document.getElementById('statusText');
    const loginBtn = document.getElementById('loginBtn');
    const urlParams = new URLSearchParams(window.location.search);
    const targetOrigin = urlParams.get('origin') || '*';

    async function triggerGoogleLogin() {
      statusEl.textContent = 'Connecting to Google Authentication...';
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="spinner"></span> Authenticating...';

      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        const credential = GoogleAuthProvider.credentialFromResult(result);
        const idToken = credential?.idToken || (await user.getIdToken());

        statusEl.textContent = `Success: Signed in as ${user.email}. Transferring session...`;
        
        const payload = {
          type: 'GHAULE_AUTH_RELAY_SUCCESS',
          idToken: idToken,
          user: {
            uid: user.uid,
            name: user.displayName || 'Google User',
            email: user.email || '',
            photoURL: user.photoURL || '',
            provider: 'google.com'
          }
        };

        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(payload, targetOrigin);
          setTimeout(() => {
            window.close();
          }, 800);
        } else {
          statusEl.textContent = 'Authentication successful! You may return to your Ghaule Calculator tab.';
        }
      } catch (err) {
        console.error('Relay login error:', err);
        statusEl.textContent = 'Error: ' + (err.message || err.code || 'Login failed');
        loginBtn.disabled = false;
        loginBtn.innerHTML = 'Try Again';

        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({
            type: 'GHAULE_AUTH_RELAY_ERROR',
            error: err.message,
            code: err.code
          }, targetOrigin);
        }
      }
    }

    loginBtn.addEventListener('click', triggerGoogleLogin);

    // Auto trigger on initial load if query param auto=1
    if (urlParams.get('auto') === '1') {
      triggerGoogleLogin();
    }
  </script>
</head>
<body>

    <div class="logo" style="padding: 0; overflow: hidden;"><img src="/assets/aistudio/IMG_20261113_104800_d465bc78.png" alt="Ghaule Calculator" style="width: 100%; height: 100%; object-fit: cover;"></div>
    <h1>Ghaule Calculator</h1>
    <p>Permanent Google Authentication Portal for Project <strong style="color: #60a5fa;">gen-lang-client-0255150793</strong></p>
    <div class="status" id="statusText">Ready to authenticate via permanent authorized domain.</div>
    <button id="loginBtn" class="btn">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Sign in with Google
    </button>
    <div class="info">
      This page runs on the authorized Firebase Hosting domain to bypass third-party iframe and preview domain restrictions.
    </div>
  </div>
</body>
</html>
