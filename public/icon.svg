<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1E3A8A" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- App Card Base -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Subtle inner border -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="#60A5FA" stroke-width="4" stroke-opacity="0.5" />

  <!-- Calculator Screen -->
  <rect x="80" y="80" width="352" height="110" rx="28" fill="url(#screenGrad)" />
  <rect x="84" y="84" width="344" height="102" rx="24" fill="none" stroke="#93C5FD" stroke-width="2" />
  
  <!-- Screen Text / Display -->
  <text x="400" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#1E3A8A" text-anchor="end">
    रु 1,15,000
  </text>
  <circle cx="112" cy="115" r="7" fill="#10B981" />
  <text x="130" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#3B82F6">
    GHAULE BS/AD
  </text>

  <!-- Keypad Buttons -->
  <!-- Row 1 -->
  <rect x="80" y="220" width="70" height="56" rx="16" fill="#3B82F6" />
  <text x="115" y="258" font-family="sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text>

  <rect x="174" y="220" width="70" height="56" rx="16" fill="#3B82F6" />
  <text x="209" y="258" font-family="sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">8</text>

  <rect x="268" y="220" width="70" height="56" rx="16" fill="#3B82F6" />
  <text x="303" y="258" font-family="sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">9</text>

  <rect x="362" y="220" width="70" height="56" rx="16" fill="url(#orangeGrad)" />
  <text x="397" y="258" font-family="sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle">÷</text>

  <!-- Row 2 -->
  <rect x="80" y="296" width="70" height="56" rx="16" fill="#3B82F6" />
  <text x="115" y="334" font-family="sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>

  <rect x="174" y="296" width="70" height="56" rx="16" fill="#3B82F6" />
  <text x="209" y="334" font-family="sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>

  <rect x="268" y="296" width="70" height="56" rx="16" fill="#3B82F6" />
  <text x="303" y="334" font-family="sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>

  <rect x="362" y="296" width="70" height="56" rx="16" fill="url(#orangeGrad)" />
  <text x="397" y="334" font-family="sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle">×</text>

  <!-- Row 3 -->
  <rect x="80" y="372" width="70" height="56" rx="16" fill="#3B82F6" />
  <text x="115" y="410" font-family="sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>

  <rect x="174" y="372" width="70" height="56" rx="16" fill="#3B82F6" />
  <text x="209" y="410" font-family="sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>

  <rect x="268" y="372" width="70" height="56" rx="16" fill="#3B82F6" />
  <text x="303" y="410" font-family="sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>

  <rect x="362" y="372" width="70" height="132" rx="16" fill="url(#accentGrad)" />
  <text x="397" y="448" font-family="sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF" text-anchor="middle">=</text>

  <!-- Row 4 -->
  <rect x="80" y="448" width="164" height="56" rx="16" fill="#2563EB" />
  <text x="162" y="486" font-family="sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">0</text>

  <rect x="268" y="448" width="70" height="56" rx="16" fill="#3B82F6" />
  <text x="303" y="486" font-family="sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">.</text>
</svg>
